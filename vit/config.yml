model:
  # deit
  deit_tiny_distilled_patch16_224:
    image_size: 224
    patch_size: 16
    d_model: 192
    n_heads: 3
    n_layers: 12
    normalization: deit
    distilled: true
  deit_small_distilled_patch16_224:
    image_size: 224
    patch_size: 16
    d_model: 384
    n_heads: 6
    n_layers: 12
    normalization: deit
    distilled: true
  deit_base_distilled_patch16_224:
    image_size: 224
    patch_size: 16
    d_model: 768
    n_heads: 12
    n_layers: 12
    normalization: deit
    distilled: true
  deit_base_distilled_patch16_384:
    image_size: 384
    patch_size: 16
    d_model: 768
    n_heads: 12
    n_layers: 12
    normalization: deit
    distilled: true
  # vit pretrained for finetuning
  vit_tiny_patch16_224_in21k:
    image_size: 384
    patch_size: 16
    d_model: 192
    n_heads: 3
    n_layers: 12
    normalization: vit
    distilled: false
  vit_small_patch16_224_in21k:
    image_size: 384
    patch_size: 16
    d_model: 384
    n_heads: 6
    n_layers: 12
    normalization: vit
    distilled: false
  vit_base_patch16_224_in21k:
    image_size: 384
    patch_size: 16
    d_model: 768
    n_heads: 12
    n_layers: 12
    normalization: vit
    distilled: false
  vit_large_patch16_224_in21k:
    image_size: 384
    patch_size: 16
    d_model: 1024
    n_heads: 16
    n_layers: 24
    normalization: vit
  # vit already finetuned
  vit_base_patch8_384:
    image_size: 384
    patch_size: 8
    d_model: 768
    n_heads: 12
    n_layers: 12
    normalization: vit
    distilled: false
  vit_tiny_patch16_384:
    image_size: 384
    patch_size: 16
    d_model: 192
    n_heads: 3
    n_layers: 12
    normalization: vit
    distilled: false
  vit_small_patch16_384:
    image_size: 384
    patch_size: 16
    d_model: 384
    n_heads: 6
    n_layers: 12
    normalization: vit
    distilled: false
  vit_base_patch16_384:
    image_size: 384
    patch_size: 16
    d_model: 768
    n_heads: 12
    n_layers: 12
    normalization: vit
    distilled: false
  vit_large_patch16_384:
    image_size: 384
    patch_size: 16
    d_model: 1024
    n_heads: 16
    n_layers: 24
    normalization: vit
  vit_small_patch32_384:
    image_size: 384
    patch_size: 32
    d_model: 384
    n_heads: 6
    n_layers: 12
    normalization: vit
    distilled: false
  vit_base_patch32_384:
    image_size: 384
    patch_size: 32
    d_model: 768
    n_heads: 12
    n_layers: 12
    normalization: vit
  vit_large_patch32_384:
    image_size: 384
    patch_size: 32
    d_model: 1024
    n_heads: 16
    n_layers: 24
    normalization: vit
dataset:
  imagenet:  # ILSVRC2012 version
    steps: 20000
    epochs: 8  # computed from steps value
    warmup_steps: 500
    eval_freq: 1
    batch_size: 512
    learning_rate: 0.03
    minlearning_rate: 0
    warmup_start_factor: 0.000001
    im_size: 448
    crop_size: 384
  cifar100:
    steps: 10000
    epochs: 100  # computed from steps value
    warmup_steps: 200
    eval_freq: 1
    batch_size: 512
    learning_rate: 0.03
    minlearning_rate: 0
    warmup_start_factor: 0.000001
    im_size: 448
    crop_size: 384
  oxford_pets:
    steps: 500
    epochs: 70  # computed from steps value
    warmup_steps: 10
    eval_freq: 1
    batch_size: 512
    learning_rate: 0.03
    min_learning_rate: 0
    warmup_start_factor: 0.000001
    im_size: 448
    crop_size: 384
  oxford_flowers:
    steps: 500
    epochs: 250  # computed from steps value
    warmup_steps: 10
    eval_freq: 2
    batch_size: 512
    learning_rate: 0.03
    min_learning_rate: 0
    warmup_start_factor: 0.000001
    im_size: 448
    crop_size: 384
