[build-system]
requires = [
    "setuptools<80.9.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "setr"
version = "0.0.1b"
description = "SETR: Transformer for Semantic Segmentation adapted for G2TM."
readme = { file = "./setr/README.md", content-type = "text/markdown" }
dependencies = [
    "click",
    "ftfy",
    "regex",
    "numpy",
    "einops",
    "python-hostlist",
    "tqdm",
    "requests",
    "pyyaml",
    "torch>=2",
    "torchvision",
    "onnx",
    "onnxscript",
    "onnxruntime-gpu==1.26.0",  # Last version working with CUDA 12.x
    "timm==0.4.12",
    "mmcv<2.2.0",
    "mmsegmentation==1.2.2",
    "networkx==3.6.1",
    "fvcore",
    "cityscapesscripts",
    "tensorboard",
]

[project.optional-dependencies]
dev = [
    "pylint",
    "flake8",
]
